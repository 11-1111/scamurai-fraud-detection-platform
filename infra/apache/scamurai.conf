# Apache reverse proxy for a single-server Scamurai deployment.
#
# The containers publish on loopback only; Apache terminates TLS and is the
# one thing listening on a public port. Nothing else needs to be reachable
# from outside, and the datastores must not be.
#
#   sudo a2enmod proxy proxy_http headers deflate rewrite ssl http2
#   sudo cp infra/apache/scamurai.conf /etc/apache2/sites-available/
#   sudo a2ensite scamurai && sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Replace scamurai.example.com throughout. Obtain the certificate with
# `sudo certbot --apache -d scamurai.example.com` before enabling the TLS
# vhost below.

# ---------------------------------------------------------------
# Port 80: redirect everything to TLS, except the ACME challenge
# certbot needs to renew.
# ---------------------------------------------------------------
<VirtualHost *:80>
    ServerName scamurai.example.com

    DocumentRoot /var/www/html

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
        RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/scamurai-error.log
    CustomLog ${APACHE_LOG_DIR}/scamurai-access.log combined
</VirtualHost>

# ---------------------------------------------------------------
# Port 443: the application
# ---------------------------------------------------------------
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName scamurai.example.com

    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/scamurai.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/scamurai.example.com/privkey.pem
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   off

    # ---------------------------------------------------------------
    # Upstreams. Published on loopback by docker compose, so these are
    # unreachable from the network even if Apache stops.
    # ---------------------------------------------------------------

    ProxyPreserveHost On
    ProxyTimeout 60

    # The BFF mounts every route under /bff, so the prefix passes through
    # unchanged rather than being rewritten.
    ProxyPass        /bff/ http://127.0.0.1:3000/bff/
    ProxyPassReverse /bff/ http://127.0.0.1:3000/bff/

    # The dashboard is built with Vite base "/api3dash/" and nginx serves it
    # from a matching path, so this prefix is preserved too.
    ProxyPass        /api3dash/ http://127.0.0.1:8080/api3dash/
    ProxyPassReverse /api3dash/ http://127.0.0.1:8080/api3dash/

    RedirectMatch 302 ^/$ /api3dash/

    # The fraud engine and the transactions API are internal. They are
    # deliberately not proxied: the dashboard talks to the BFF, and the BFF
    # talks to them. Exposing them here would route around the one layer
    # that validates input.

    # ---------------------------------------------------------------
    # Response headers
    # ---------------------------------------------------------------
    <IfModule mod_headers.c>
        # Two years, which is the minimum for preload eligibility. Only
        # enable includeSubDomains once every subdomain is served over TLS.
        Header always set Strict-Transport-Security "max-age=63072000"

        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"

        # Fraud review screens show cardholder data. Keeping them out of
        # shared caches is not optional.
        <LocationMatch "^/bff/">
            Header always set Cache-Control "no-store"
        </LocationMatch>

        Header unset X-Powered-By
    </IfModule>

    ServerTokens Prod

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css \
            application/javascript application/json image/svg+xml
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/scamurai-error.log
    CustomLog ${APACHE_LOG_DIR}/scamurai-access.log combined
</VirtualHost>
</IfModule>
