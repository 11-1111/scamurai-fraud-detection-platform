server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames, so assets can be cached hard while
    # index.html must not be: a stale index points at asset names that no
    # longer exist, which is the usual cause of a blank page after a deploy.
    location /api3dash/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /api3dash/index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The router is a history-mode router, so any unmatched path under the
    # base has to fall through to index.html for the client to resolve.
    location /api3dash/ {
        try_files $uri $uri/ /api3dash/index.html;
    }

    location = / {
        return 302 /api3dash/;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    # Hardening that costs nothing on a static bundle. A full CSP belongs with
    # the reverse proxy in front of this, where the API origins are known.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;
}
